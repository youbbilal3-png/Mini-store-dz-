<!doctype html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest?v=2"><link rel="icon" href="app-icon.svg?v=2" type="image/svg+xml">
<title>MINABYB | حسابي</title>
<link rel="stylesheet" href="styles.css?v=20261115-4"><link rel="stylesheet" href="account.css?v=20261115-3">
<script type="module" src="account.js?v=20261115-3"></script>
</head>
<body class="account-page">
<header class="site-header">
<a class="brand" href="index.html" aria-label="MINABYB home"><img class="brand-symbol" src="app-icon.svg" alt=""><span class="brand-name" dir="ltr"><span class="brand-mina">MINA</span><span class="brand-byb">BYB</span><small class="brand-tagline">WORLD OF SHOPPING</small></span></a>
<a class="account-home-link" href="index.html" id="accountHomeLink">الصفحة الرئيسية</a>
</header>
<main class="account-main">
<section class="account-card">
<span class="account-eyebrow">MINABYB · ACCOUNT</span>
<div class="account-profile-head">
<div class="account-avatar" id="accountAvatar" aria-label="Account picture"><span id="accountAvatarInitial">م</span><img id="accountAvatarImage" alt="" hidden></div>
<div class="account-profile-heading"><h1 id="accountTitle">حسابي</h1><p id="accountIntro">معلومات حسابك على MINABYB.</p></div>
</div>
<div class="account-photo-actions">
<input id="accountPhotoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<button class="account-photo-button" id="accountPhotoChoose" type="button">إضافة صورة شخصية</button>
<button class="account-photo-remove" id="accountPhotoRemove" type="button" hidden>حذف الصورة</button>
</div>
<div class="account-details">
<div><span id="accountNameLabel">الاسم</span><strong id="accountName">—</strong></div>
<div><span id="accountEmailLabel">البريد الإلكتروني</span><strong id="accountEmail">—</strong></div>
<div><span id="accountTypeLabel">نوع الحساب</span><strong id="accountType">—</strong></div>
</div>
<div class="account-actions">
<a class="account-primary-action" id="accountStoreAction" href="create-store.html" hidden>أنشئ متجرك</a>
<button class="account-secondary-action" id="accountLogoutButton" type="button">تسجيل الخروج</button>
</div>
<p class="account-feedback" id="accountFeedback" role="status" aria-live="polite"></p>
</section>
</main>
<footer><strong>MINABYB — WORLD OF SHOPPING</strong></footer>
</body></html>
