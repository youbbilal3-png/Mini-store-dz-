<!doctype html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="app-icon.svg?v=2" type="image/svg+xml">
<title>إنشاء متجرك | MINABYB</title>
<link rel="stylesheet" href="styles.css?v=20261114-35">
<style>
.create-store-main{max-width:760px;margin:42px auto;padding:0 18px 48px}
.create-store-card{background:var(--panel,#fff);border:1px solid rgba(120,140,160,.2);border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 55px rgba(0,0,0,.12)}
.create-store-card h1{margin:8px 0 10px;font-size:clamp(1.65rem,4vw,2.3rem)}
.create-store-card>p{line-height:1.8;color:var(--muted,#687386)}
.create-store-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.create-store-fields label{display:flex;flex-direction:column;gap:8px;font-weight:700}
.create-store-fields input,.create-store-fields textarea{width:100%;border:1px solid rgba(120,140,160,.35);border-radius:12px;padding:13px 14px;background:var(--surface,#fff);color:inherit;font:inherit;box-sizing:border-box}
.create-store-fields textarea{min-height:105px;resize:vertical}
.create-store-wide{grid-column:1/-1}
.create-store-submit{width:100%;margin-top:22px;border:0;border-radius:13px;padding:15px;background:#15966a;color:#fff;font:inherit;font-weight:800;cursor:pointer}
.create-store-submit:disabled{opacity:.6;cursor:wait}
.create-store-feedback{min-height:26px;margin-top:12px;color:var(--muted,#687386);line-height:1.6}
.create-store-note{font-size:.9rem}
@media(max-width:600px){.create-store-fields{grid-template-columns:1fr}.create-store-wide{grid-column:auto}.create-store-main{margin-top:24px}}
</style>
<script>try{const l=localStorage.getItem("msdz-language");if(["ar","fr","en","es","de","tr"].includes(l)){document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";}}catch(e){}</script>
<script type="module" src="create-store.js?v=20261115-1"></script>
</head>
<body class="dashboard-page">
<header class="site-header dashboard-header">
<a class="brand" href="index.html" aria-label="MINABYB home"><img class="brand-symbol" src="app-icon.svg" alt=""><span class="brand-name" dir="ltr"><span class="brand-mina">MINA</span><span class="brand-byb">BYB</span><small class="brand-tagline">WORLD OF SHOPPING</small></span></a>
<div class="dashboard-header-actions"><label class="language-picker"><span class="sr-only">Language</span><select id="createStoreLanguage" aria-label="Choose language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="tr">Türkçe</option></select></label><a class="dashboard-back" href="index.html" data-t="home">الرئيسية</a></div>
</header>
<main class="create-store-main">
<section class="create-store-card">
<span class="eyebrow">MINABYB · YOUR BUSINESS STARTS HERE</span>
<h1 data-t="title">أنشئ متجرك الإلكتروني</h1>
<p data-t="intro">أدخل معلومات متجرك. سيبقى حسابك نفسه، وبعد إنشاء المتجر ستتمكن من الدخول إلى لوحة التاجر وإضافة منتجاتك.</p>
<form id="createStoreForm">
<div class="create-store-fields">
<label><span data-t="storeName">اسم المتجر</span><input id="newStoreName" maxlength="60" required autocomplete="organization" placeholder="مثال: متجر الأناقة"></label>
<label><span data-t="sellerName">اسم صاحب المتجر</span><input id="newSellerName" maxlength="60" required autocomplete="name"></label>
<label class="create-store-wide"><span data-t="bio">نبذة قصيرة عن المتجر (اختياري)</span><textarea id="newStoreBio" maxlength="300"></textarea></label>
<label class="create-store-wide"><span data-t="whatsapp">رقم WhatsApp مع رمز الدولة (اختياري)</span><input id="newStoreWhatsapp" type="tel" inputmode="numeric" maxlength="20" placeholder="213XXXXXXXXX"></label>
</div>
<button class="create-store-submit" id="createStoreSubmit" type="submit" data-t="submit">إنشاء متجري</button>
<p class="create-store-feedback" id="createStoreFeedback" role="status" aria-live="polite"></p>
<p class="create-store-note" data-t="note">لن يتم إنشاء متجر إلا بعد الضغط على زر إنشاء متجري بنجاح.</p>
</form>
</section>
</main>
</body></html>
