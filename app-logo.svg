<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 500" role="img" aria-labelledby="title desc">
<title id="title">MINABYB — WORLD OF SHOPPING</title>
<desc id="desc">Glossy mint shopping bag with an integrated green M and blue B, a dynamic blue orbit, and a 3D MINABYB wordmark.</desc>
<defs>
 <linearGradient id="bag" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#6BFFE0"/><stop offset=".34" stop-color="#19D8B0"/><stop offset=".72" stop-color="#0CB28F"/><stop offset="1" stop-color="#08766F"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#C4FFF0"/><stop offset=".25" stop-color="#49E8BD"/><stop offset=".7" stop-color="#12C99D"/><stop offset="1" stop-color="#078A78"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B3E8FF"/><stop offset=".25" stop-color="#40B9FF"/><stop offset=".62" stop-color="#087FDE"/><stop offset="1" stop-color="#064E9D"/></linearGradient>
 <linearGradient id="orbit" x1="0" y1="0" x2="1" y2=".1"><stop stop-color="#13CBA7"/><stop offset=".45" stop-color="#21D5C0"/><stop offset="1" stop-color="#087EDC"/></linearGradient>
 <linearGradient id="wordMint" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#76F9D4"/><stop offset=".48" stop-color="#20D4A6"/><stop offset="1" stop-color="#078D79"/></linearGradient>
 <linearGradient id="wordBlue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1D6F98"/><stop offset=".48" stop-color="#0B4567"/><stop offset="1" stop-color="#062D48"/></linearGradient>
 <filter id="depth" x="-30%" y="-35%" width="170%" height="190%"><feGaussianBlur in="SourceAlpha" stdDeviation="11"/><feOffset dy="17"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-20%" y="-30%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Shopping bag body and handle -->
<g filter="url(#depth)">
 <path d="M205 173v-49c0-73 47-115 108-115s108 42 108 115v49" fill="none" stroke="#087E77" stroke-width="29" stroke-linecap="round"/>
 <path d="M205 168v-42c0-62 42-98 108-98s108 36 108 98v42" fill="none" stroke="#37E7C1" stroke-width="12" stroke-linecap="round"/>
 <path d="M145 153h342q26 0 22 27l-27 267q-3 24-29 24H166q-26 0-29-24l-27-267q-4-27 35-27z" fill="url(#bag)" stroke="#9BFFE8" stroke-width="9"/>
 <path d="M160 168q-6 235 24 276" fill="none" stroke="#D9FFF5" stroke-width="7" opacity=".8"/>
 <path d="M177 185h278" fill="none" stroke="#E3FFF8" stroke-width="5" opacity=".55"/>
</g>
<!-- Motion streaks -->
<g fill="none" stroke="#19CBA8" stroke-linecap="round">
 <path d="M108 238l-67 20" stroke-width="17"/><path d="M112 286l-78 25" stroke-width="17"/><path d="M117 334l-65 22" stroke-width="17"/>
</g>
<!-- Orbit behind the monogram -->
<path d="M355 176c119-35 226 2 232 82 6 80-72 153-198 191" fill="none" stroke="#075CA9" stroke-width="24" stroke-linecap="round" opacity=".95"/>
<path d="M352 168c124-30 231 9 236 90 5 74-72 147-198 187" fill="none" stroke="url(#orbit)" stroke-width="17" stroke-linecap="round"/>
<path d="M362 168c108-22 196 14 201 81" fill="none" stroke="#B4FFF0" stroke-width="5" stroke-linecap="round" opacity=".9"/>
<!-- Interlocking MB -->
<g filter="url(#soft)">
 <path d="M178 365V194h39l63 78 64-78h39v171h-47V269l-56 68-56-68v96z" fill="#056E63" opacity=".45" transform="translate(4 8)"/>
 <path d="M173 356V185h39l63 78 64-78h39v171h-47V260l-56 68-56-68v96z" fill="url(#mint)" stroke="#D1FFF4" stroke-width="5" stroke-linejoin="round"/>
 <path d="M334 185h54c72 0 91 70 41 99 57 30 36 103-39 103h-56v-44h49c35 0 35-39 0-39h-37v-41h37c29 0 29-35 0-35h-49z" fill="url(#blue)" stroke="#BDEAFF" stroke-width="5" stroke-linejoin="round"/>
</g>
<!-- Wordmark -->
<g font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-8" filter="url(#depth)">
 <text x="535" y="291" font-size="190" fill="url(#wordBlue)" stroke="#062B43" stroke-width="5" paint-order="stroke">MINA</text>
 <text x="1004" y="291" font-size="190" fill="url(#wordMint)" stroke="#087E72" stroke-width="5" paint-order="stroke">BYB</text>
</g>
<!-- Glossy sweep and tagline -->
<path d="M548 348q316-78 758-28" fill="none" stroke="#086AA5" stroke-width="15" stroke-linecap="round" opacity=".8"/>
<path d="M548 340q316-78 758-28" fill="none" stroke="url(#orbit)" stroke-width="11" stroke-linecap="round"/>
<path d="M610 420h75m670 0h75" stroke="#47788A" stroke-width="6" stroke-linecap="round"/>
<text x="925" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="19" fill="#254D63">WORLD OF SHOPPING</text>
</svg>