<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>حساب التاجر | Mini Store DZ</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth.css">
<script type="module" src="auth.js"></script>
</head>
<body class="auth-page">
<header class="site-header auth-header"><a class="brand" href="index.html"><span class="brand-mark">M</span><span>Mini Store <b>DZ</b></span></a><a class="dashboard-back" href="index.html">العودة للمتجر</a></header>
<main class="auth-main">
<section class="auth-card">
<span class="eyebrow">MINI STORE DZ · MERCHANT ACCOUNT</span>
<h1 id="authTitle">مرحباً بك في Mini Store DZ</h1>
<p class="auth-intro" id="authIntro">أنشئ حساب التاجر الخاص بك وابدأ بإدارة متجرك.</p>
<div class="auth-tabs"><button type="button" class="active" id="showSignup">إنشاء حساب</button><button type="button" id="showLogin">تسجيل الدخول</button></div>
<form id="authForm">
<label id="nameField">اسم التاجر<input id="fullName" type="text" maxlength="50" placeholder="اسمك أو اسم نشاطك" required></label>
<label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></label>
<label>كلمة المرور<input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="8 أحرف على الأقل" required></label>
<button class="auth-submit" id="submitButton" type="submit">إنشاء حسابي</button>
<p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
</form>
<p class="auth-legal">بإنشاء حساب، أنت توافق على استخدام Mini Store DZ لإدارة متجرك ومنتجاتك.</p>
</section>
</main>
<footer class="auth-footer"><strong>Founder of Mini Store DZ — B.YB</strong></footer>
</body></html>
