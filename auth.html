<script>document.documentElement.classList.add("language-loading");window.setTimeout(()=>document.documentElement.classList.remove("language-loading"),3000);try{const l=localStorage.getItem("msdz-language");if(["ar","fr","en","es","de","tr"].includes(l)){document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";}}catch(e){}</script>
<link rel="stylesheet" href="styles.css?v=20261115-8"><link rel="stylesheet" href="auth.css?v=20261115-10">
<script type="module" src="auth.js?v=20261115-18"></script>
<script defer src="pwa.js?v=20261113-1"></script>

<body class="auth-page">
<header class="site-header auth-header">
<a class="brand auth-brand" href="auth.html" aria-label="MINABYB"><img class="brand-symbol" src="app-icon.svg" alt=""><span class="brand-name" dir="ltr"><span class="brand-mina">MINA</span><span class="brand-byb">BYB</span><small class="brand-tagline">WORLD OF SHOPPING</small></span></a>
<label class="auth-language-picker" aria-label="Language"><span aria-hidden="true">🌐</span><select id="authLanguageSelect" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="tr">Türkçe</option></select></label>

</header>
<main class="auth-landing">


<section class="auth-main" id="authFormSection">
<section class="auth-card">

<span class="eyebrow">MINI STORE DZ</span>
<h1 id="authTitle">مرحباً بك في MINABYB</h1>
<p class="auth-intro" id="authIntro">أنشئ حسابك للبدء.</p>
<div class="auth-tabs"><button type="button" class="active" id="showSignup">إنشاء حساب</button><button type="button" id="showLogin">تسجيل الدخول</button></div>
<form id="authForm">
<label id="nameField">اسم التاجر<input id="fullName" type="text" maxlength="50" placeholder="اسمك أو اسم نشاطك" required></label>
<label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" placeholder="name@example.com" required></label>
<label>كلمة المرور<span class="password-input-wrap"><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="8 أحرف على الأقل" required><button type="button" class="password-visibility-toggle" id="togglePasswordVisibility" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
<button class="auth-submit" id="submitButton" type="submit">إنشاء حسابي</button>
<p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
</form>
<p class="auth-legal">بعد إنشاء حسابك وتسجيل الدخول، يمكنك إنشاء متجرك من داخل المنصة.</p>
</section>
</section>
</main>
<footer class="auth-footer"><strong>Founder of MINABYB — B.YB</strong><p>© <span id="authYear"></span> MINABYB</p></footer>
